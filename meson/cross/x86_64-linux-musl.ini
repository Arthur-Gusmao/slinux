[binaries]
c = 'clang'
cpp = 'clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'pkgconf'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
c_args = ['-static', '-Os', '-pipe', '-fno-stack-protector']
c_link_args = ['-static', '-s']
cpp_args = ['-static', '-Os', '-pipe', '-fno-stack-protector']
cpp_link_args = ['-static', '-s']

[properties]
sys_root = '/home/aw/slinux/out/sysroot'